name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild AudioDuplicate.csproj /t:Restore /p:RestoreIgnoreFailedSources=true

      - name: Build
        run: msbuild AudioDuplicate.csproj /p:Configuration=Release /p:Platform=x64 /m

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "bin/x64/Release/net48/AudioDuplicate.exe" "artifact/AudioDuplicate.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AudioDuplicate-Windows-x64
          path: artifact/AudioDuplicate.exe
          if-no-files-found: error
