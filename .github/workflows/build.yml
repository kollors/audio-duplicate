name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item "build/Release/AudioDuplicate.exe" "artifact/AudioDuplicate.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: AudioDuplicate-Windows-x64
          path: artifact/AudioDuplicate.exe
          if-no-files-found: error
