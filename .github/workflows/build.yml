name: Build Windows Portable

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore AudioDuplicate.csproj

      - name: Publish
        run: dotnet publish AudioDuplicate.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o portable

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $portable = (Resolve-Path "portable").Path
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) {
            $candidate = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($candidate) { $mp = $candidate.FullName }
          }
          if (-not (Test-Path $mp)) {
            throw "Microsoft Defender scanner is unavailable on this runner."
          }
          & $mp -Scan -ScanType 3 -File $portable -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender scan failed or detected a threat. Exit code: $LASTEXITCODE"
          }

      - name: Create ZIP
        shell: pwsh
        run: Compress-Archive -Path "portable/*" -DestinationPath "AudioDuplicate-portable.zip" -Force

      - name: Upload portable build
        uses: actions/upload-artifact@v4
        with:
          name: AudioDuplicate-Windows-x64-portable
          path: AudioDuplicate-portable.zip
          if-no-files-found: error
