name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+([-.][0-9A-Za-z.-]+)?$') {
            throw "Invalid VERSION: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore AudioDuplicate.csproj

      - name: Publish
        run: dotnet publish AudioDuplicate.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o portable

      - name: Microsoft Defender scan
        shell: pwsh
        run: |
          $portable = (Resolve-Path "portable").Path
          $mp = Join-Path $env:ProgramFiles "Windows Defender\MpCmdRun.exe"
          if (-not (Test-Path $mp)) {
            $candidate = Get-ChildItem "$env:ProgramData\Microsoft\Windows Defender\Platform\*\MpCmdRun.exe" -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($candidate) { $mp = $candidate.FullName }
          }
          if (-not (Test-Path $mp)) {
            throw "Microsoft Defender scanner is unavailable on this runner."
          }
          & $mp -Scan -ScanType 3 -File $portable -DisableRemediation
          if ($LASTEXITCODE -ne 0) {
            throw "Microsoft Defender scan failed or detected a threat. Exit code: $LASTEXITCODE"
          }

      - name: Create release ZIP
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: Compress-Archive -Path "portable/*" -DestinationPath "AudioDuplicate-v$env:VERSION-portable.zip" -Force

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $asset = "AudioDuplicate-v$env:VERSION-portable.zip"
          gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" "$asset" --clobber --repo "$env:GITHUB_REPOSITORY"
          } else {
            gh release create "$env:TAG" "$asset" `
              --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" `
              --title "Audio Duplicate v$env:VERSION" `
              --generate-notes
          }
